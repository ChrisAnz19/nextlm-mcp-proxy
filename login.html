<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to NextLM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F3F4F6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #030213;
      padding: 32px 40px 28px;
      text-align: center;
    }
    .logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 14px;
    }
    .logo-nextlm { height: 44px; }
    .logo-claude { height: 48px; border-radius: 10px; }
    .logo-separator {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-separator-line {
      width: 24px; height: 2px;
      background: rgba(255, 255, 255, 0.2);
    }
    .logo-separator-dot {
      width: 8px; height: 8px;
      background: #BCFC00;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(188, 252, 0, 0.6);
    }
    .connection-label {
      color: #9CA3AF;
      font-size: 13px;
      font-weight: 500;
    }
    .body {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }
    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #0B0F14;
      margin-bottom: 4px;
      text-align: center;
    }
    .card-subtitle {
      font-size: 13px;
      color: #6B7280;
      margin-bottom: 28px;
      text-align: center;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #0B0F14;
      margin-bottom: 6px;
    }
    .field + .field { margin-top: 16px; }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: #FFFFFF;
      border: 1.5px solid #E5E7EB;
      border-radius: 12px;
      color: #0B0F14;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #BCFC00;
      box-shadow: 0 0 0 3px rgba(188, 252, 0, 0.15);
    }
    input::placeholder { color: #9CA3AF; }
    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      background: #BCFC00;
      color: #0B0F14;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .btn:hover { background: #a8e600; }
    .btn:disabled { background: #9ACA00; cursor: not-allowed; opacity: 0.7; }
    .error {
      background: #FEE2E2;
      color: #DC2626;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 500;
    }
    .spinner {
      display: none;
      text-align: center;
      margin-top: 12px;
      color: #6B7280;
      font-size: 13px;
      font-weight: 500;
    }
    .note {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: #9CA3AF;
      letter-spacing: 0.02em;
    }
  </style>
</head>

    <div class="connection-label">Connect your accounts</div>
  </div>
  <div class="body">
    <div class="card">
      <div class="card-title">Sign In</div>
      <div class="card-subtitle">Connect your NextLM account to Claude</div>
      <div id="error-box" class="error" style="display:none"></div>
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@company.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn" id="submit-btn">Sign In</button>
        <div id="spinner" class="spinner">Signing in...</div>
      </form>
      <div class="note">Requires Apex tier or higher</div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const SERVER_URL = '__SERVER_URL__';

    const errorMsg = params.get('error');
    if (errorMsg) {
      const box = document.getElementById('error-box');
      box.textContent = decodeURIComponent(errorMsg);
      box.style.display = 'block';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const spinner = document.getElementById('spinner');
      const errorBox = document.getElementById('error-box');
      errorBox.style.display = 'none';
      btn.disabled = true;
      spinner.style.display = 'block';

      try {
        const resp = await fetch(SERVER_URL + '/authorize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            client_id: params.get('client_id') || '',
            redirect_uri: params.get('redirect_uri') || '',
            code_challenge: params.get('code_challenge') || '',
            code_challenge_method: params.get('code_challenge_method') || 'S256',
            state: params.get('state') || '',
          }),
        });

        const data = await resp.json();

        if (resp.ok && data.redirect_url) {
          window.location.href = data.redirect_url;
          return;
        } else {
          errorBox.textContent = data.error || 'Invalid email or password.';
          errorBox.style.display = 'block';
          btn.disabled = false;
          spinner.style.display = 'none';
        }
      } catch (err) {
        errorBox.textContent = 'Connection error. Please try again.';
        errorBox.style.display = 'block';
        btn.disabled = false;
        spinner.style.display = 'none';
      }
    });
  </script>
